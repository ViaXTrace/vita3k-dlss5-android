name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JVM_OPTS: -Xmx6G
      VCPKG_ROOT: /usr/local/share/vcpkg
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/cmake/vcpkg-triplets

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ${{ env.VCPKG_ROOT }}/installed
            ${{ env.VCPKG_ROOT }}/packages
          key: ${{ runner.os }}-vita3k-android-${{ hashFiles('**/build.gradle', 'vcpkg.json', '.gitmodules', 'cmake/vcpkg-triplets/arm64-android.cmake') }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache
          vcpkg install boost-system:arm64-android boost-filesystem:arm64-android boost-program-options:arm64-android boost-icl:arm64-android boost-variant:arm64-android openssl:arm64-android zlib:arm64-android

      - name: Prepare assets
        run: |
          rm -rf android/assets/data android/assets/lang android/assets/shaders-builtin
          cp -r data android/assets/data
          cp -r lang android/assets/lang
          cp -r vita3k/shaders-builtin android/assets/shaders-builtin

      - name: Build debug APK
        run: ./gradlew --stacktrace --configuration-cache --build-cache --parallel --configure-on-demand assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vita3k-nss-${{ github.sha }}
          path: android/build/outputs/apk/debug/android-debug.apk

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            NSS (Experimental) is a no-cost shader-only screen reconstruction pass.
            It is not NVIDIA DLSS and does not include proprietary NVIDIA code or models.
          files: android/build/outputs/apk/debug/android-debug.apk